[package]
name = "inbox-outbox-demo"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8.6", default-features = false, features = ["macros", "migrate", "postgres", "runtime-tokio"] }
thiserror = "2"
tokio = { version = "1.52", features = ["macros", "rt-multi-thread"] }
